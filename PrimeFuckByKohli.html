<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>@xxLEGEND_KOHLI</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bungee&family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* Body transparent for APK background */
        body {
            background: transparent !important;
            overflow: hidden;
            width: 100vw;
            height: 100dvh;
            position: fixed;
            inset: 0;
            margin: 0;
        }

        /* ══ ORIGINAL TERI.HTML CSS ══ */
        #tufan-widget-root{
            --green:#39ff14;--green2:#00c83c;--lime:#b9ff00;--cyan:#00eaff;
            --gold:#ffe600;--red:#ff225d;--purple:#bc28ff;--ink:#000603;
            --panel:#001208;--flight:2.25s;--scan-progress:0;
        }
        #tufan-widget-root, #tufan-widget-root *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;font-family:Orbitron,sans-serif}
        #tufan-widget-root .hidden{display:none!important}

        #tufan-widget-root .liveWinLayer{position:fixed;inset:0;z-index:99990;pointer-events:none;overflow:hidden}
        #tufan-widget-root .lw-card{position:absolute;top:64px;left:50%;display:flex;align-items:center;gap:8px;max-width:92vw;padding:7px 14px 7px 8px;border:1px solid rgba(57,255,20,.62);border-radius:15px;background:linear-gradient(135deg,rgba(0,30,11,.96),rgba(0,5,2,.98));box-shadow:0 10px 25px #000,0 0 20px rgba(57,255,20,.35),inset 0 0 15px rgba(57,255,20,.15);backdrop-filter:blur(10px);opacity:0;animation:sxToastIn .45s cubic-bezier(.2,1.15,.35,1.1) forwards,sxToastOut .35s ease-in 4.15s forwards}
        #tufan-widget-root .lw-card:after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--green),var(--cyan),var(--gold));transform-origin:left;animation:sxToastTimer 4.35s linear forwards}
        @keyframes sxToastIn{0%{transform:translateX(115%) scale(.85);opacity:0}65%{transform:translateX(-52%) scale(1.03);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}
        @keyframes sxToastOut{to{transform:translateX(115%) scale(.88);opacity:0}}
        @keyframes sxToastTimer{to{transform:scaleX(0)}}
        #tufan-widget-root .lw-sig{padding:3px 5px;border-radius:4px;background:linear-gradient(#fff,var(--lime));color:#001006;font-size:7px;font-weight:900;box-shadow:0 0 8px var(--green)}
        #tufan-widget-root .lw-avatar{position:relative;width:29px;height:29px;display:grid;place-items:center;flex:none;overflow:hidden;border:1px solid var(--green);border-radius:50%;background:#001208;color:#fff;font:700 12px 'Chakra Petch',sans-serif;box-shadow:0 0 9px rgba(57,255,20,.5)}
        #tufan-widget-root .lw-avatar-fb{position:absolute;inset:0;display:grid;place-items:center;font:900 12px 'Chakra Petch',sans-serif;color:#fff}
        #tufan-widget-root .lw-avatar img{position:relative;z-index:2;width:100%;height:100%;object-fit:cover}
        #tufan-widget-root .lw-text{min-width:0;line-height:1.16}
        #tufan-widget-root .lw-label{display:flex;align-items:center;gap:4px;color:var(--cyan);font-size:6.8px;font-weight:900;letter-spacing:.15em;text-shadow:0 0 6px var(--cyan)}
        #tufan-widget-root .lw-label:before{content:"";width:4px;height:4px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:sxBlink 1s infinite}
        #tufan-widget-root .lw-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:700 11px 'Chakra Petch',sans-serif;color:#fff}
        #tufan-widget-root .lw-amt{margin-left:4px;color:var(--gold);font:12px Audiowide;text-shadow:0 0 7px var(--gold)}
        @keyframes sxBlink{50%{opacity:.25}}

        #tufan-widget-root .launcher{position:fixed;left:0;top:0;width:58px;height:58px;z-index:9999;display:grid;place-items:center;border:1.5px solid rgba(57,255,20,.65);border-radius:50%;cursor:grab;touch-action:none;background:radial-gradient(circle at 32% 25%,rgba(57,255,20,.34),transparent 48%),linear-gradient(145deg,#003012,#000b05 62%,#000);box-shadow:0 12px 28px #000,0 0 18px rgba(57,255,20,.48),inset 0 0 15px rgba(57,255,20,.24);will-change:transform}
        #tufan-widget-root .launcher:active{cursor:grabbing}
        @keyframes sxOrbCoreFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3px) rotate(2deg)}}
        #tufan-widget-root .launcher-glass{position:absolute;inset:3px;border:1px solid rgba(255,255,255,.14);border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.16),transparent 55%)}
        #tufan-widget-root .launcher-core{position:relative;z-index:4;width:72%;height:72%;display:grid;place-items:center;overflow:hidden;border-radius:50%;filter:drop-shadow(0 0 6px var(--green));animation:sxOrbCoreFloat 3.8s ease-in-out infinite}
        #tufan-widget-root .launcher-icon-img{width:100%;height:100%;display:block;object-fit:cover;border-radius:50%;pointer-events:none}
        #tufan-widget-root .launcher-fallback{font:900 17px 'Chakra Petch',sans-serif;color:var(--green);text-shadow:0 0 8px var(--green)}
        #tufan-widget-root .launcher-ring{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);pointer-events:none}
        #tufan-widget-root .launcher-ring circle{fill:none;stroke:var(--green);stroke-width:1.7;stroke-linecap:round;stroke-dasharray:28 16;transform-origin:50% 50%;animation:sxSpin 6s linear infinite;filter:drop-shadow(0 0 3px var(--green))}
        #tufan-widget-root .launcher-ring .r2{stroke:var(--lime);stroke-width:1.1;stroke-dasharray:8 21;animation-duration:4s;animation-direction:reverse}
        #tufan-widget-root .launcher-orbit{position:absolute;inset:-6px;z-index:3;animation:sxSpin 3s linear infinite}
        #tufan-widget-root .launcher-orbit i{position:absolute;top:-2px;left:50%;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 9px var(--lime)}
        @keyframes sxSpin{to{transform:rotate(360deg)}}

        #tufan-widget-root .wrap{position:fixed;left:0;top:0;z-index:10000;display:none;align-items:center;justify-content:center;opacity:0;pointer-events:none;touch-action:none;scale:.9;transition:opacity .2s ease,scale .25s cubic-bezier(.2,.9,.2,1.1);will-change:transform}
        #tufan-widget-root .wrap.visible{display:flex;opacity:1;pointer-events:auto;scale:1}
        #tufan-widget-root .wrap.dragging{transition:none!important}
        
        #tufan-widget-root .flight-chassis{position:relative;display:flex;align-items:center;justify-content:center;will-change:transform}
        
        #tufan-widget-root .wing-backlight{position:absolute;width:280px;height:160px;z-index:0;pointer-events:none;background:radial-gradient(ellipse,rgba(57,255,20,.045),transparent 70%);filter:blur(8px)}
        #tufan-widget-root .wing{position:absolute;top:48%;width:220px;height:165px;z-index:1;pointer-events:none;background:url('https://i.ibb.co/mF1fS5m2/file-0000000017bc8211a51be6c0e30fe47a.png') center/contain no-repeat;filter:drop-shadow(0 0 2px rgba(57,255,20,.12));will-change:transform}
        #tufan-widget-root .wing.left{left:-80px;background-position:left center;clip-path:polygon(0 0,66% 0,66% 100%,0 100%);transform-origin:right 58%;animation:sxFlapL var(--flight) ease-in-out infinite}
        #tufan-widget-root .wing.right{right:-80px;background-position:right center;clip-path:polygon(34% 0,100% 0,100% 100%,34% 100%);transform-origin:left 58%;animation:sxFlapR var(--flight) ease-in-out infinite}
        @keyframes sxFlapL{0%,100%{transform:translateY(-50%) rotate(-12deg) scaleY(.94)}50%{transform:translateY(-50%) rotate(14deg) scaleY(1.06)}}
        @keyframes sxFlapR{0%,100%{transform:translateY(-50%) rotate(12deg) scaleY(.94)}50%{transform:translateY(-50%) rotate(-14deg) scaleY(1.06)}}

        #tufan-widget-root .wing-particles{position:absolute;top:48%;width:220px;height:165px;z-index:2;pointer-events:none;transform:translateY(-50%)}
        #tufan-widget-root .wing-particles.left{left:-80px;animation:sxFlapL var(--flight) ease-in-out infinite}
        #tufan-widget-root .wing-particles.right{right:-80px;animation:sxFlapR var(--flight) ease-in-out infinite}
        #tufan-widget-root .wp{position:absolute;width:2px;height:2px;border-radius:50%;background:radial-gradient(circle,#ffffff 0%,#effff3 20%,#9dffb2 48%,#34d86a 72%,transparent 88%);box-shadow:0 0 4px rgba(255,255,255,.95),0 0 8px rgba(135,255,175,.62),0 0 14px rgba(57,255,120,.32);opacity:0;will-change:transform,opacity}
        #tufan-widget-root .wp.p1{top:20%;left:15%;animation:sxWingP1 2.4s ease-in-out infinite}
        #tufan-widget-root .wp.p2{top:40%;left:8%;width:2px;height:2px;animation:sxWingP2 2.8s ease-in-out .3s infinite}
        #tufan-widget-root .wp.p3{top:60%;left:22%;width:3px;height:3px;animation:sxWingP3 2.2s ease-in-out .6s infinite}
        #tufan-widget-root .wp.p4{top:30%;left:35%;width:2px;height:2px;background:radial-gradient(circle,#fff 0%,#dffff0 26%,#63f596 58%,transparent 82%);box-shadow:0 0 5px rgba(255,255,255,.9),0 0 10px rgba(95,255,150,.48);animation:sxWingP4 2.6s ease-in-out .9s infinite}
        #tufan-widget-root .wp.p5{top:75%;left:12%;width:2px;height:2px;background:radial-gradient(circle,#fff 0%,#e9fff1 28%,#52ee88 58%,transparent 82%);box-shadow:0 0 5px rgba(255,255,255,.9),0 0 10px rgba(82,238,136,.46);animation:sxWingP5 2.3s ease-in-out 1.1s infinite}
        #tufan-widget-root .wp.p6{top:50%;left:45%;width:2px;height:2px;animation:sxWingP6 2.5s ease-in-out .4s infinite}
        @keyframes sxWingP1{0%,100%{transform:translate(0,0) scale(0);opacity:0}20%{opacity:1;transform:scale(1)}80%{opacity:.8}50%{transform:translate(-18px,-14px) scale(1.2);opacity:1}}
        @keyframes sxWingP2{0%,100%{transform:translate(0,0) scale(0);opacity:0}30%{opacity:1}50%{transform:translate(-14px,10px) scale(1.4);opacity:.9}}
        @keyframes sxWingP3{0%,100%{transform:translate(0,0) scale(0);opacity:0}25%{opacity:1;transform:scale(1)}50%{transform:translate(-20px,-8px) scale(1.3);opacity:1}}
        @keyframes sxWingP4{0%,100%{transform:translate(0,0) scale(0);opacity:0}30%{opacity:1}55%{transform:translate(-12px,-18px) scale(1.5);opacity:.95}}
        @keyframes sxWingP5{0%,100%{transform:translate(0,0) scale(0);opacity:0}25%{opacity:1}50%{transform:translate(-16px,14px) scale(1.2);opacity:1}}
        @keyframes sxWingP6{0%,100%{transform:translate(0,0) scale(0);opacity:0}30%{opacity:1}50%{transform:translate(-22px,-6px) scale(1.3);opacity:.9}}
        #tufan-widget-root .wing-particles.right .wp{transform:scaleX(-1)}
        #tufan-widget-root .wing-particles.right .wp.p1{animation:sxWingP1R 2.4s ease-in-out infinite}
        #tufan-widget-root .wing-particles.right .wp.p2{animation:sxWingP2R 2.8s ease-in-out .3s infinite}
        #tufan-widget-root .wing-particles.right .wp.p3{animation:sxWingP3R 2.2s ease-in-out .6s infinite}
        #tufan-widget-root .wing-particles.right .wp.p4{animation:sxWingP4R 2.6s ease-in-out .9s infinite}
        #tufan-widget-root .wing-particles.right .wp.p5{animation:sxWingP5R 2.3s ease-in-out 1.1s infinite}
        #tufan-widget-root .wing-particles.right .wp.p6{animation:sxWingP6R 2.5s ease-in-out .4s infinite}
        @keyframes sxWingP1R{0%,100%{transform:translate(0,0) scale(0);opacity:0}20%{opacity:1;transform:scale(1)}50%{transform:translate(18px,-14px) scale(1.2);opacity:1}}
        @keyframes sxWingP2R{0%,100%{transform:translate(0,0) scale(0);opacity:0}30%{opacity:1}50%{transform:translate(14px,10px) scale(1.4);opacity:.9}}
        @keyframes sxWingP3R{0%,100%{transform:translate(0,0) scale(0);opacity:0}25%{opacity:1}50%{transform:translate(20px,-8px) scale(1.3);opacity:1}}
        @keyframes sxWingP4R{0%,100%{transform:translate(0,0) scale(0);opacity:0}30%{opacity:1}55%{transform:translate(12px,-18px) scale(1.5);opacity:.95}}
        @keyframes sxWingP5R{0%,100%{transform:translate(0,0) scale(0);opacity:0}25%{opacity:1}50%{transform:translate(16px,14px) scale(1.2);opacity:1}}
        @keyframes sxWingP6R{0%,100%{transform:translate(0,0) scale(0);opacity:0}30%{opacity:1}50%{transform:translate(22px,-6px) scale(1.3);opacity:.9}}

        #tufan-widget-root .wp.x{--dx:-20px;--dy:-16px;animation:sxWingPX 2.5s ease-in-out infinite}
        #tufan-widget-root .wing-particles.right .wp.x{--dx:20px;--dy:-16px}
        @keyframes sxWingPX{0%,100%{transform:translate(0,0) scale(0);opacity:0}20%{opacity:1;transform:scale(.7)}50%{transform:translate(var(--dx),var(--dy)) scale(1.5);opacity:1}78%{opacity:0}}
        #tufan-widget-root .wp.p7{top:10%;left:42%;width:2px;height:2px;animation-delay:.1s}
        #tufan-widget-root .wp.p8{top:52%;left:56%;width:2px;height:2px;animation-delay:.4s}

        #tufan-widget-root .wing-particles.right .wp.p2{left:auto;right:8%}

        #tufan-widget-root .claw-layer{position:absolute;top:32px;width:42px;height:165px;z-index:25;pointer-events:none}
        #tufan-widget-root .claw-layer.left{left:-20px}
        #tufan-widget-root .claw-layer.right{right:-20px;transform:scaleX(-1)}
        #tufan-widget-root .claw-shake{width:100%;height:100%;animation:sxClawShake 7.5s infinite}
        #tufan-widget-root .finger{position:absolute;width:100%;transform-origin:left center}
        #tufan-widget-root .f1{top:10px;animation:sxF1 3s infinite}
        #tufan-widget-root .f2{top:45px;animation:sxF2 4s -1.2s infinite}
        #tufan-widget-root .f3{top:82px;animation:sxF3 3.5s -2s infinite}
        #tufan-widget-root .f4{top:118px;animation:sxF4 5s -3s infinite}
        #tufan-widget-root .f-base{position:absolute;left:0;width:21px;height:11px;border-top:1px solid rgba(100,255,100,.5);border-radius:6px 0 0 6px;background:linear-gradient(#066c19,#000900);box-shadow:2px 2px 5px #000}
        #tufan-widget-root .f-mid{position:absolute;left:18px;top:1px;width:14px;height:9px;border-radius:2px;background:linear-gradient(#08a522,#000a00);transform:rotate(-12deg);transform-origin:left}
        #tufan-widget-root .f-tip{position:absolute;left:10px;top:1px;width:23px;height:8px;clip-path:polygon(0 10%,100% 45%,0 90%,25% 45%);background:linear-gradient(90deg,#fff,#39ff14 36%,#004f00);filter:drop-shadow(0 0 3px var(--green));transform:rotate(-24deg);transform-origin:left}
        @keyframes sxClawShake{66%,78%{transform:translate(1.5px,-1px)}68%,80%{transform:translate(-1.5px,1px)}}
        @keyframes sxF1{0%,100%{transform:rotate(24deg)}25%{transform:rotate(29deg)}}
        @keyframes sxF2{0%,100%{transform:rotate(9deg)}30%{transform:rotate(14deg)}}
        @keyframes sxF3{0%,100%{transform:rotate(-6deg)}20%{transform:rotate(-2deg)}}
        @keyframes sxF4{0%,100%{transform:rotate(-21deg)}35%{transform:rotate(-15deg)}}

        #tufan-widget-root .box-wrapper{position:relative;z-index:10;width:218px;height:276px;display:flex;overflow:hidden;padding:2px;border-radius:38px;background:#000;isolation:isolate;cursor:grab;box-shadow:0 0 30px rgba(57,255,20,.38),0 18px 50px rgba(0,0,0,.96)}
        #tufan-widget-root .box-wrapper:active{cursor:grabbing}
        #tufan-widget-root .box-wrapper:before,#tufan-widget-root .box-wrapper:after{content:"";position:absolute;left:-75%;top:-75%;width:250%;height:250%;z-index:0;background:conic-gradient(from 0deg,transparent 64%,var(--green) 77%,#fff 82%,var(--cyan) 87%,transparent 100%);animation:sxPlasma 3.8s linear infinite}
        #tufan-widget-root .box-wrapper:after{background:conic-gradient(from 180deg,transparent 64%,var(--green2) 77%,var(--gold) 82%,var(--lime) 88%,transparent 100%);animation-duration:5.2s;animation-direction:reverse;opacity:.72}

        #tufan-widget-root .box{position:relative;z-index:1;width:100%;height:100%;overflow:hidden;border-radius:36px;padding:10px 9px 9px;background:radial-gradient(circle at 50% -10%,rgba(0,83,30,.72),transparent 53%),linear-gradient(#001208,#000803 57%,#000201);box-shadow:inset 0 0 22px rgba(57,255,20,.24)}
        #tufan-widget-root .box:after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;background:linear-gradient(112deg,transparent 20%,rgba(255,255,255,.08) 35%,transparent 49%);transform:translateX(-130%);animation:sxPanelShine 6.3s linear infinite}

        @keyframes sxAmbient{to{transform:rotate(24deg) scale(1.15)}}
        #tufan-widget-root .dot-field{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
        #tufan-widget-root .dot-field i{position:absolute;bottom:-8px;width:3px;height:3px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green);opacity:0;animation:sxRise 5s linear infinite}

    <!-- ══ JAVASCRIPT LOGIC (BALANCE SYSTEM REMOVED) ══ -->
    <script>
    (function() {
        'use strict';

        /* ═══ ZAYRO BRIDGE ═══ */
        if(typeof ZAYRO==='undefined') window.ZAYRO = {
            speak: function() {}, playSound: function() {}, stopSound: function() {},
            openUrl: function(u) { try { window.location.replace(u); } catch(e) {} },
            navigate: function(u) { try { window.location.replace(u); } catch(e) {} }
        };
        if(typeof ZAYROUI==='undefined') window.ZAYROUI = { setArea: function() {} };

        function navTo(url) {
            if(!url) return;
            let done = false;
            try { if(typeof ZAYRO.openUrl==='function') { ZAYRO.openUrl(url); done = true; } } catch(e) {}
            if(!done) { try { if(typeof ZAYRO.navigate==='function') { ZAYRO.navigate(url); done = true; } } catch(e) {} }
            if(!done) { window.location.replace(url); }
        }

        /* ═══ STATE VARIABLES ═══ */
        let isIntercepting = false, curState = 'wait', bypassRunning = false;
        let lastPeriod = null, predData = null, lockedPeriod = null, lockedPrediction = null, wingoHackDone = false;
        let _audioMap = {};

        const LOGIC = {
            0:{n:'5',s:'BIG'},1:{n:'2',s:'SMALL'},2:{n:'4',s:'SMALL'},3:{n:'7',s:'BIG'},
            4:{n:'8',s:'BIG'},5:{n:'9',s:'BIG'},6:{n:'0',s:'SMALL'},7:{n:'3',s:'SMALL'},
            8:{n:'6',s:'BIG'},9:{n:'1',s:'SMALL'}
        };

        const NUMBER_IMAGE_MAP = {
            0: 'https://i.ibb.co/WvTR3Jrx/num0.png',
            1: 'https://i.ibb.co/yFQwGPZv/num1.png',
            2: 'https://i.ibb.co/XZNjXwjq/num2.png',
            3: 'https://i.ibb.co/233fFQqz/num3.png',
            4: 'https://i.ibb.co/mVsBYfQR/num4.png',
            5: 'https://i.ibb.co/Dg5kjr9L/num5.png',
            6: 'https://i.ibb.co/Z1HMQSPM/num6.png',
            7: 'https://i.ibb.co/0y8yYzDH/num7.png',
            8: 'https://i.ibb.co/dsRvZmSf/num8.png',
            9: 'https://i.ibb.co/prMV31Ng/num9.png'
        };

        /* ═══ AUDIO SYSTEM ═══ */
        function stopAudio() { try{ ZAYRO.stopSound(); }catch(e){} _audioMap={}; }
        function playAudio(f) { 
            if(!f) return; 
            let n = Date.now(); 
            if(_audioMap[f] && (n-_audioMap[f]) < 3200) return; 
            _audioMap[f] = n; 
            try{ ZAYRO.playSound(f); }catch(e){} 
        }
        function playAudioForce(f) { 
            if(!f) return; 
            delete _audioMap[f]; 
            try{ ZAYRO.stopSound(); }catch(e){} 
            _audioMap[f] = Date.now(); 
            setTimeout(function(){ try{ ZAYRO.playSound(f); }catch(e){} }, 60); 
        }

        /* ═══ DOM REFERENCES ═══ */
        var mainPanel = document.getElementById('dregWrap');
        var cardOuter = document.getElementById('cardOuter');
        var orbEl = document.getElementById('dregOrb');
        var actionBtn = document.getElementById('actionBtn');
        var closeBtn = document.getElementById('closeBtn');
        var statusOverlay = document.getElementById('statusOverlay');
        var stageScanner = document.getElementById('stageScanner');
        var predDisplay = document.getElementById('predDisplay');
        var dregEyeRing = document.getElementById('dregEyeRing');
        var statusMain = document.getElementById('statusMain');
        var statusSub = document.getElementById('statusSub');
        var statusHint = document.getElementById('statusHint');
        var statusText = document.getElementById('statusText');
        var actionBtnLabel = actionBtn.querySelector('.btn-label');
        var predBadge = document.getElementById('predBadge');
        var predNumImg = document.getElementById('predNumImg');
        var predNumVal = document.getElementById('predNumVal');
        var predPeriodBox = document.getElementById('predPeriodBox');
        var scanPctText = document.getElementById('scanPctText');
        var scanPhase = document.getElementById('scanPhase');
        var scanLogText = document.getElementById('scanLogText');
        var scanFlash = document.getElementById('scanFlash');
        var eyeHousingBox = document.getElementById('eyeHousingBox');

        /* ═══ SIMPLIFIED URL MONITOR ═══ */
        window.setUrl = function(url) {
            let u = (url||'').toString().toLowerCase(), hash = u.split('#')[1]||'';
            let isWingo = hash.indexOf('/saaslottery')>=0 || hash.indexOf('wingo')>=0 || hash.indexOf('lottery')>=0;
            if(isWingo) { if(!bypassRunning) window.setState('wingo'); else curState='wingo'; }
            else window.setState('home');
        };

        /* ═══ STATE MANAGEMENT (NO BALANCE) ═══ */
        window.setState = function(name) {
            if(name==='wait') { bypassRunning=false; _goState('wait'); }
            else if(name==='home') { bypassRunning=false; _goState('home'); }
            else if(name==='wingo') { if(bypassRunning) return; _goState('wingo'); wingoHackDone=false; }
        };

        function _goState(n) {
            if(isIntercepting) return;
            if(curState==='scan' && n!=='wingo' && n!=='result') return;
            stopAudio(); curState=n;
            updateUI();
        }

        /* ═══ UI UPDATER ═══ */
        function setStatusUI(main, sub, hint) { statusMain.textContent=main; statusSub.textContent=sub; statusHint.textContent=hint; }
        function setActionLabel(label) { actionBtnLabel.innerHTML = (label==='EXECUTE') ? `▶ ${label}` : label; }

        function showStatus() {
            statusOverlay.classList.add('show');
            predDisplay.classList.remove('active', 'reveal');
            stageScanner.classList.remove('active');
            stopScannerCanvas();
            dregEyeRing.style.opacity = '1';
        }

        function showPrediction(result, num) {
            statusOverlay.classList.remove('show');
            stageScanner.classList.remove('active');
            stopScannerCanvas();
            dregEyeRing.style.opacity = '.05';
            
            predBadge.textContent = result;
            predBadge.className = 'pred-badge ' + (result === 'BIG' ? 'big' : 'small');
            
            let numericNum = parseInt(num, 10);
            if (NUMBER_IMAGE_MAP[numericNum]) {
                predNumImg.src = NUMBER_IMAGE_MAP[numericNum];
                predNumImg.alt = String(numericNum);
                predNumImg.style.display = 'block';

        /* ═══ BYPASS & SCAN LOGIC ═══ */
        actionBtn.addEventListener('click', function() {

        function runScanSequence(onDone) {
            statusOverlay.classList.remove('show');
            predDisplay.classList.remove('active', 'reveal');
            dregEyeRing.style.opacity = '.03';
            stageScanner.classList.add('active');
            
            stageScanner.style.setProperty('--scan-progress', 0);
            stageScanner.style.setProperty('--halo-scale', .72);
            scanPctText.textContent = '0%';

            statusText.textContent = 'SCANNING';
            setActionLabel('SCANNING');
            
            initScanParticles();
            if(!scanAnimId) renderScanner();

            var phases = [
                { p: 0,   label: 'VECTOR MAP', log: '[vector] <span>MAPPING DEPTH COORDINATES</span>' },
                { p: .2,  label: 'PHASE LINK', log: '[phase] <span>SPINNING QUANTUM RINGS</span>' },
                { p: .43, label: 'CORE FOLD',  log: '[core] <span>FOLDING PARTICLE VORTEX</span>' },
                { p: .68, label: 'SEED SYNC',  log: '[matrix] <span>SYNCHRONIZING SIGNAL CORE</span>' },
                { p: .88, label: 'LOCKING',    log: '[lock] <span>FINALIZING SIGNAL</span>' }
            ];
            var duration = 2700, start = performance.now(), finished = false;
            
            function tick(now) {
                if(finished) return;
                var raw = Math.min(1, (now - start) / duration), smooth = raw < .75 ? raw * .96 : raw;
                stageScanner.style.setProperty('--scan-progress', smooth.toFixed(4));
                stageScanner.style.setProperty('--halo-scale', (.72 + smooth * .28).toFixed(3));
                scanPctText.textContent = Math.floor(smooth * 100) + '%';
                
                for(var i=0; i<phases.length; i++) {
                    if(smooth >= phases[i].p) { scanPhase.textContent = phases[i].label; scanLogText.innerHTML = phases[i].log; }
                }
                
                if(raw < 1) return requestAnimationFrame(tick);
                
                finished = true;
                stageScanner.style.setProperty('--scan-progress', 1);
                stageScanner.style.setProperty('--halo-scale', 1);
                scanPctText.textContent = 'LOCK';
                scanPhase.textContent = 'COMPLETE';
                scanLogText.innerHTML = '[done] <span>3D SIGNAL LOCKED</span>';
                
                scanFlash.classList.remove('fire'); void scanFlash.offsetWidth; scanFlash.classList.add('fire');
                var r = eyeHousingBox.getBoundingClientRect();
                triggerBurstExplosion(r.left + r.width / 2, r.top + r.height / 2);
                setTimeout(onDone, 420);
            }
            requestAnimationFrame(tick);
        }

        function runBypass() {
            if(bypassRunning) return;
            
            bypassRunning = true; wingoHackDone = false; curState = 'scan';
            const useSamePred = (lockedPeriod && lockedPeriod === lastPeriod && lockedPrediction) ? lockedPrediction : null;

            runScanSequence(function() {
                bypassRunning = false;
                wingoHackDone = true;
                let finalPred;
                if(useSamePred) {
                    finalPred = useSamePred;
                } else {

        /* ═══ API FETCH ═══ */
        async function fetchPeriod() {
            try {
                let res = await fetch("https://api.bdg88zf.com/api/webapi/GetGameIssue", {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({typeId:1, language:0, random:"40079dcba93a48769c6ee9d4d4fae23f", signature:"D12108C4F57C549D82B23A91E0FA20AE", timestamp:1727792520})
                });
                let j = await res.json();
                if(j && j.code === 0 && j.data && j.data.issueNumber) {
                    let cur = j.data.issueNumber.toString();
                    if(cur !== lastPeriod) {
                        lastPeriod = cur;
                        if(predPeriodBox && wingoHackDone) predPeriodBox.textContent = 'PERIOD: ' + cur.slice(-4).padStart(4,'0');

        /* ═══ CANVAS PARTICLES & EFFECTS ═══ */
        var burstCanvas = document.createElement('canvas');
        burstCanvas.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:99995';
        document.body.appendChild(burstCanvas);
        var bctx = burstCanvas.getContext('2d'), burstParticles = [], shockwaves = [];
        function resizeBurstCanvas() {
            var d = Math.min(window.devicePixelRatio || 1, 2);
            burstCanvas.width = window.innerWidth * d; burstCanvas.height = window.innerHeight * d;
            burstCanvas.style.width = window.innerWidth + 'px'; burstCanvas.style.height = window.innerHeight + 'px';
            bctx.setTransform(d, 0, 0, d, 0, 0);
        }
        function triggerBurstExplosion(x, y) {
            var colors = ['#39ff14', '#00eaff', '#ffe600', '#ffffff', '#bc28ff'];
            shockwaves.push({ x: x, y: y, r: 4, a: 1, w: 4 });
            for (var i = 0; i < 150; i++) {
                var a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 15;
                burstParticles.push({ x: x, y: y, px: x, py: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2 - Math.random() * 4, g: .24, size: 1.2 + Math.random() * 3.3, a: 1, decay: .006 + Math.random() * .009, color: colors[(Math.random() * colors.length) | 0], life: 0, shape: Math.random() > .55 ? 1 : 0 });
            }
            requestAnimationFrame(renderBurst);
        }
        function renderBurst() {
            bctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            for (var s = shockwaves.length - 1; s >= 0; s--) {
                var q = shockwaves[s]; q.r += 11; q.a -= .035;
                bctx.save(); bctx.globalAlpha = Math.max(0, q.a); bctx.strokeStyle = '#dfffff'; bctx.lineWidth = q.w;
                bctx.shadowBlur = 15; bctx.shadowColor = '#39ff14';
                bctx.beginPath(); bctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); bctx.stroke(); bctx.restore();
                if (q.a <= 0) shockwaves.splice(s, 1);
            }
            var floor = window.innerHeight - 7;
            for (var i = burstParticles.length - 1; i >= 0; i--) {
                var p = burstParticles[i];
                p.px = p.x; p.py = p.y; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .988; p.life++;
                if (p.y > floor) { p.y = floor; p.vy *= -.38; p.vx *= .65; }
                p.a -= p.decay * (p.life > 20 ? 1 : .25);
                if (p.a <= 0 || p.x < -40 || p.x > window.innerWidth + 40) { burstParticles.splice(i, 1); continue; }
                bctx.save(); bctx.globalAlpha = p.a; bctx.strokeStyle = p.color; bctx.fillStyle = p.color;
                bctx.shadowBlur = 7; bctx.shadowColor = p.color; bctx.lineWidth = Math.max(1, p.size * .65);
                if (p.shape) { bctx.beginPath(); bctx.moveTo(p.px, p.py); bctx.lineTo(p.x, p.y); bctx.stroke(); }
                else { bctx.beginPath(); bctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); bctx.fill(); }
                bctx.restore();
            }
            if (burstParticles.length || shockwaves.length) requestAnimationFrame(renderBurst);
        }
        resizeBurstCanvas();
        window.addEventListener('resize', resizeBurstCanvas);

        var hCanvas = document.getElementById('housingScanCanvas'), hctx = hCanvas.getContext('2d');
        var scanParticles = [], scanAnimId = 0, scanClock = 0;
        function resizeScannerCanvas() {
            if (!hCanvas || !hCanvas.parentElement) return;
            var d = Math.min(window.devicePixelRatio || 1, 2);
            var w = hCanvas.parentElement.clientWidth || 186, h = hCanvas.parentElement.clientHeight || 122;
            hCanvas.width = w * d; hCanvas.height = h * d;
            hCanvas.style.width = w + 'px'; hCanvas.style.height = h + 'px';
            hctx.setTransform(d, 0, 0, d, 0, 0);
        }
        function initScanParticles() {
            resizeScannerCanvas(); scanParticles = [];
            for (var i = 0; i < 100; i++) {
                var a = Math.random() * Math.PI * 2, r = 50 + Math.random() * 85;
                scanParticles.push({ a: a, r: r, z: -110 + Math.random() * 220, phase: Math.random() * Math.PI * 2, size: .6 + Math.random() * 1.5, color: i % 4 === 0 ? '#ffe600' : (i % 3 === 0 ? '#00eaff' : '#39ff14') });
            }
        }
        function project3D(x, y, z, cx, cy) { var f = 160 / (160 + z); return { x: cx + x * f, y: cy + y * f, s: f }; }
        function renderScanner() {
            var w = hCanvas.clientWidth || 186, h = hCanvas.clientHeight || 122, cx = w / 2, cy = h / 2;
            hctx.clearRect(0, 0, w, h); scanClock += .025;
            var p = parseFloat(stageScanner.style.getPropertyValue('--scan-progress')) || 0;
            var ease = 1 - Math.pow(1 - p, 3), points = [];
            for (var i = 0; i < scanParticles.length; i++) {
                var q = scanParticles[i], ring = (i % 5 < 3 ? 31 : 19) * (1 - Math.max(0, p - .88) * 5.5), ang = q.a + scanClock * (i % 2 ? 1 : -1) * (1.2 + p * 2.2);
                var targetX = Math.cos(ang) * ring, targetY = Math.sin(ang * 2 + q.phase) * 13, targetZ = Math.sin(ang) * ring;
                var scatterX = Math.cos(q.a) * q.r, scatterY = Math.sin(q.a) * q.r * .65, scatterZ = q.z;
                var x = scatterX + (targetX - scatterX) * ease, y = scatterY + (targetY - scatterY) * ease, z = scatterZ + (targetZ - scatterZ) * ease;
                if (p > .93) { var collapse = (p - .93) / .07; x *= 1 - collapse * .55; y *= 1 - collapse * .55; z *= 1 - collapse * .55; }
                var pt = project3D(x, y, z, cx, cy); pt.color = q.color; pt.size = Math.max(.4, q.size * pt.s); points.push(pt);
            }
            points.sort(function(a, b) { return a.s - b.s; });
            if (p > .34) {
                hctx.lineWidth = .45;
                for (var k = 0; k < points.length; k += 5) {
                    var a2 = points[k], b2 = points[(k + 7) % points.length], dx = a2.x - b2.x, dy = a2.y - b2.y;
                    if (dx * dx + dy * dy < 1000) { hctx.strokeStyle = 'rgba(0,234,255,' + (.08 + p * .2) + ')'; hctx.beginPath(); hctx.moveTo(a2.x, a2.y); hctx.lineTo(b2.x, b2.y); hctx.stroke(); }
                }
            }
            points.forEach(function(pt) {
                hctx.save(); hctx.globalAlpha = .45 + p * .55; hctx.fillStyle = pt.color; hctx.shadowBlur = 5; hctx.shadowColor = pt.color;
                hctx.beginPath(); hctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); hctx.fill(); hctx.restore();
            });
            hctx.save(); hctx.strokeStyle = 'rgba(255,230,0,' + (p * .5) + ')'; hctx.lineWidth = 1;
            hctx.beginPath(); hctx.arc(cx, cy, 8 + p * 13, scanClock, scanClock + Math.PI * 1.45); hctx.stroke(); hctx.restore();
            scanAnimId = requestAnimationFrame(renderScanner);
        }
        function stopScannerCanvas() {
            if (scanAnimId) { cancelAnimationFrame(scanAnimId); scanAnimId = 0; }
            hctx.clearRect(0, 0, hCanvas.clientWidth || 186, hCanvas.clientHeight || 122);
        }

        setInterval(function() { document.getElementById('statPing').textContent = (15 + Math.floor(Math.random() * 8)) + 'MS'; }, 1600);

        /* ═══ DRAG LOGIC ═══ */
        var PANEL_W = 218, PANEL_H = 276;
        var orbPos = { x: window.innerWidth - 48, y: window.innerHeight - 150 };
        var panelPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        function setOrbPos(x, y) {
            var w = orbEl.offsetWidth || 58, h = orbEl.offsetHeight || 58;
            orbPos.x = Math.max(8, Math.min(window.innerWidth - w - 8, x - w / 2));
            orbPos.y = Math.max(8, Math.min(window.innerHeight - h - 8, y - h / 2));
            orbEl.style.transform = 'translate3d(' + orbPos.x + 'px,' + orbPos.y + 'px,0)';
        }
        function setPanelPos(x, y) {
            var w = cardOuter.offsetWidth || PANEL_W, h = cardOuter.offsetHeight || PANEL_H;
            panelPos.x = Math.max(8, Math.min(window.innerWidth - w - 8, x - w / 2));
            panelPos.y = Math.max(8, Math.min(window.innerHeight - h - 8, y - h / 2));
            mainPanel.style.transform = 'translate3d(' + panelPos.x + 'px,' + panelPos.y + 'px,0)';
        }
        setOrbPos(orbPos.x, orbPos.y);
        setPanelPos(panelPos.x, panelPos.y);

        var orbDragging = false, orbMoved = false, orbStart = { x: 0, y: 0 }, orbRAFQueued = false;
        orbEl.addEventListener('pointerdown', function(e) {
            orbDragging = true; orbMoved = false;
            orbStart.x = e.clientX; orbStart.y = e.clientY;
            try { orbEl.setPointerCapture(e.pointerId); } catch (err) {}
            e.preventDefault();
        });
        orbEl.addEventListener('pointermove', function(e) {
            if (!orbDragging) return;
            var dx = e.clientX - orbStart.x, dy = e.clientY - orbStart.y;
            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) orbMoved = true;
            if (!orbMoved) return;
            orbEl.style.animation = 'none';
            orbPos.x += dx; orbPos.y += dy;
            orbStart.x = e.clientX; orbStart.y = e.clientY;
            if (!orbRAFQueued) {
                orbRAFQueued = true;
                requestAnimationFrame(function() { orbRAFQueued = false; setOrbPos(orbPos.x + 29, orbPos.y + 29); reportArea(); });
            }
        });
        function orbEnd(e) {
            if (!orbDragging) return;
            orbDragging = false;
            orbEl.style.animation = '';
            if (!orbMoved) openPanel();
            orbMoved = false;
            if (e) { try { orbEl.releasePointerCapture(e.pointerId); } catch (err) {} }
            reportArea();
        }
        orbEl.addEventListener('pointerup', orbEnd);
        orbEl.addEventListener('pointercancel', orbEnd);

        var panelDragging = false, panelStart = { x: 0, y: 0 }, panelRAFQueued = false;
        mainPanel.addEventListener('pointerdown', function(e) {
            if (e.target.closest('button')) return;
            panelDragging = true;
            mainPanel.classList.add('dragging');
            panelStart.x = e.clientX; panelStart.y = e.clientY;
            try { mainPanel.setPointerCapture(e.pointerId); } catch (err) {}
        });
        mainPanel.addEventListener('pointermove', function(e) {
            if (!panelDragging) return;
            panelPos.x += (e.clientX - panelStart.x);
            panelPos.y += (e.clientY - panelStart.y);
            panelStart.x = e.clientX; panelStart.y = e.clientY;
            if (!panelRAFQueued) {
                panelRAFQueued = true;
                requestAnimationFrame(function() {
                    panelRAFQueued = false;
                    setPanelPos(panelPos.x + (cardOuter.offsetWidth || PANEL_W) / 2, panelPos.y + (cardOuter.offsetHeight || PANEL_H) / 2);
                    reportArea();
                });
            }
        });
        function panelEnd(e) {
            panelDragging = false;
            mainPanel.classList.remove('dragging');
            if (e) { try { mainPanel.releasePointerCapture(e.pointerId); } catch (err) {} }
            reportArea();
        }
        mainPanel.addEventListener('pointerup', panelEnd);
        mainPanel.addEventListener('pointercancel', panelEnd);

        function openPanel() {
            orbEl.classList.add('hidden');
            mainPanel.classList.add('visible');
            setPanelPos(window.innerWidth / 2, window.innerHeight / 2);
            reportArea();
        }
        function closePanel() {
            mainPanel.classList.remove('visible');
            setTimeout(function() {
                orbEl.classList.remove('hidden');

        closeBtn.addEventListener('click', closePanel);

        function reportArea() {

                let el = mainPanel.classList.contains('visible') ? mainPanel : orbEl;

                ZAYROUI.setArea(r.left/innerWidth, r.top/innerHeight, r.right/innerWidth, r.bottom/innerHeight);
            } catch(e) {}

        setInterval(reportArea, 300);

        /* ═══ BOOT ═══ */
        window.addEventListener('resize', function() {
            setOrbPos(orbPos.x + 29, orbPos.y + 29);
            setPanelPos(panelPos.x + PANEL_W / 2, panelPos.y + PANEL_H / 2);
        });

        window.onload = function() {

            setInterval(fetchPeriod, 3000);
        };

    })();
